name: CI

on:
  pull_request:
  push:
    branches: [main]
    # The coordinator's notes are read by no check; a push of only these skips CI. Pull requests always run.
    paths-ignore:
      - docs/plan/RESUME.md
      - docs/plan/trail/decisions.tsv
      - docs/plan/trail/standing-orders.md
      - docs/plan/trail/owner-brief.md
      - docs/plan/trail/lane-brief.md
      - docs/plan/trail/verification-tiers.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # pnpm quality compares the baseline with the copy where this branch forked from origin/main.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          # apps/web unit tests draw images in headless Chromium.
          browsers: 'true'
      - name: No high or critical advisory in production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm check
      - run: pnpm test:live

  db:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.90.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/supabase-images
          key: supabase-images-${{ github.job }}-2.90.0-v1
      - run: tools/ci/images.sh load ~/.cache/supabase-images
      - run: tools/ci/db-start.sh -x studio,realtime,imgproxy,mailpit
      - run: tools/ci/images.sh save ~/.cache/supabase-images
      - name: Reset twice and compare checksums
        # The Supabase CLI can answer 502 while db reset restarts the Storage container; one restart of the stack and
        # one retry clear it, as tools/ci-local.sh does.
        run: |
          pnpm db:seed:check 2>&1 | tee "$RUNNER_TEMP/seed-check.log" && exit 0
          grep -q 'Error status 502' "$RUNNER_TEMP/seed-check.log" || exit 1
          echo "::warning::db reset got a 502 while it restarted a container; restarting the stack and retrying once"
          pnpm db:stop
          tools/ci/db-start.sh -x studio,realtime,imgproxy,mailpit,postgres-meta
          pnpm db:seed:check
      - name: Every business table seeded in every household, and the SPEC 9.3 seed facts
        run: pnpm seed:coverage --database && pnpm seed:facts
      - run: pnpm db:test
      - name: Screens and reports against the seeded database
        # Each file works in its own seeded household, so the files do not collide; scripts/web-integration.ts sets the
        # test clock first and clears it after.
        run: pnpm --filter web test:integration
      - name: Generated database types match the migrations
        run: pnpm db:types && git diff --exit-code packages/db/src/database.types.ts
      - name: Export a household, load it into an empty database and compare row counts (PLT-2)
        # Last, because it resets the database: db:reset:empty leaves the migrations and no household rows.
        run: |
          pnpm exec tsx scripts/roundtrip-checks.ts odd-names ryan.lane9@demo.esta.test
          pnpm exec tsx scripts/export-household.ts ryan.lane9@demo.esta.test "$RUNNER_TEMP/export"
          pnpm db:reset:empty
          pnpm exec tsx scripts/roundtrip-checks.ts rollback "$RUNNER_TEMP/export"
          pnpm exec tsx scripts/roundtrip-checks.ts refused "$RUNNER_TEMP/export"
          node scripts/import-export.ts "$RUNNER_TEMP/export"
          node scripts/row-counts.ts "$RUNNER_TEMP/export" | tee "$RUNNER_TEMP/row-counts.log"
          grep -q '^tables and files match what this export holds' "$RUNNER_TEMP/row-counts.log"

  e2e:
    name: e2e (${{ matrix.id }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The clock project runs one test at a time because a stack has one test clock, and Playwright shards by test
      # count in project order, so plain --shard would pile the clock specs onto the last shards. Each shard has its
      # own stack, so the clock specs split across four. tools/ci/e2e-summary.mjs fails when a project runs nowhere.
      matrix:
        include:
          - { id: viewports-1, projects: --project=mobile --project=desktop, shard: 1/2 }
          - { id: viewports-2, projects: --project=mobile --project=desktop, shard: 2/2 }
          - { id: clock-1, projects: --project=clock, shard: 1/4 }
          - { id: clock-2, projects: --project=clock, shard: 2/4 }
          - { id: clock-3, projects: --project=clock, shard: 3/4 }
          - { id: clock-4, projects: --project=clock, shard: 4/4 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: 'true'
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.90.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/supabase-images
          key: supabase-images-${{ github.job }}-2.90.0-v1
      - run: tools/ci/images.sh load ~/.cache/supabase-images
      - run: tools/ci/db-start.sh -x studio,realtime,imgproxy,postgres-meta
      - run: tools/ci/images.sh save ~/.cache/supabase-images
      - name: Run the shard on a production build, retrying a failed test once
        run: pnpm e2e $PROJECTS --shard="$SHARD" --retries=1 --reporter=list,blob
        env:
          PROJECTS: ${{ matrix.projects }}
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: ${{ matrix.id }}.zip
      - id: strip
        if: ${{ !cancelled() }}
        run: tools/ci/strip-key-traces.sh blob-report
      - if: ${{ !cancelled() && steps.strip.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-${{ matrix.id }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

  e2e-report:
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*
          merge-multiple: true
          path: all-blob-reports
      - run: pnpm exec playwright merge-reports --reporter=html,json all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
      - name: Count the tests and name the flaky ones
        run: node tools/ci/e2e-summary.mjs e2e-results.json
      - if: ${{ needs.e2e.result == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  prod-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: 'true'
      - run: pnpm e2e:prod
      - run: pnpm check:build-env

  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the Impeccable engine at the digest in .github/impeccable-engine.sha256
        run: |
          bin=$(scripts/install-impeccable-engine.sh "$RUNNER_TEMP/impeccable")
          echo "IMPECCABLE_BIN=$bin" >> "$GITHUB_ENV"
      - run: test "$(.claude/skills/impeccable/scripts/impeccable engine-probe)" = "impeccable-engine $(cat .claude/skills/impeccable/scripts/VERSION)"
      - run: pnpm design:detect

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: tools/ci/mutation.sh

  ci:
    needs: [check, db, e2e, e2e-report, prod-build, design, mutation]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
