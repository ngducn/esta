name: CI

on:
  pull_request:
    # A draft runs check and design only; marking it ready starts the full run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    # The coordinator's notes are read by no check; a push of only these skips CI. Pull requests always run.
    paths-ignore:
      - docs/plan/RESUME.md
      - docs/plan/trail/decisions.tsv
      - docs/plan/trail/standing-orders.md
      - docs/plan/trail/owner-brief.md
      - docs/plan/trail/lane-brief.md
      - docs/plan/trail/verification-tiers.md
  # A push to main repeats a result its pull request run already tested, so it runs check, design, db and prod-build;
  # the nightly run and a manual run are the full suite.
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'

defaults:
  run:
    shell: bash

# A pull_request run checks out refs/pull/N/merge, the PR merged into main as it stands now, so a branch is tested as it
# would land. Pinning the head sha would test the branch against its older base (#439 went red that way).
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pnpm quality compares the baseline with the copy where this branch forked from origin/main.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          # apps/web unit tests draw images in headless Chromium.
          browsers: 'true'
      - run: tools/ci/jobs/check.sh

  db:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.90.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/supabase-images
          # v2 holds the pg_prove image that db:test pulls; a v1 cache has no copy of it and is never rewritten.
          key: supabase-images-${{ github.job }}-2.90.0-v2
      - run: tools/ci/images.sh load ~/.cache/supabase-images
      - run: tools/ci/db-start.sh -x studio,realtime,imgproxy,mailpit
      - name: Seed, pgTAP, integration tests, types and the export round trip
        run: tools/ci/jobs/db.sh
        env:
          CI_STACK_EXCLUDE: studio,realtime,imgproxy,mailpit
      - name: Keep the images, pgTAP's runner included, for the next run
        # After db:test, because the pg_prove image is pulled by it; the cache action saves the folder when the job ends.
        run: tools/ci/images.sh save ~/.cache/supabase-images

  e2e:
    if: ${{ github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: e2e (${{ matrix.id }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The clock project (the specs that move the global test clock row, start the agent worker or freeze lane households)
      # runs one test at a time, and Playwright shards by test count in project order, so plain --shard would pile its
      # specs onto the last shards; it has four shards, each with its own stack. Every job costs about 190 s of setup
      # (image load, database start) before its tests, so there are no more jobs than main had. tools/ci/e2e-summary.mjs
      # fails when a project runs nowhere.
      matrix:
        include:
          - { id: viewports-1, projects: --project=mobile --project=desktop, shard: 1/2 }
          - { id: viewports-2, projects: --project=mobile --project=desktop, shard: 2/2 }
          - { id: clock-1, projects: --project=clock, shard: 1/4, weights: '64:76:86:92' }
          - { id: clock-2, projects: --project=clock, shard: 2/4, weights: '64:76:86:92' }
          - { id: clock-3, projects: --project=clock, shard: 3/4, weights: '64:76:86:92' }
          - { id: clock-4, projects: --project=clock, shard: 4/4, weights: '64:76:86:92' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: 'true'
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.90.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/supabase-images
          key: supabase-images-${{ github.job }}-2.90.0-v1
      - run: tools/ci/images.sh load ~/.cache/supabase-images
      - run: tools/ci/db-start.sh -x studio,realtime,imgproxy,postgres-meta
      - run: tools/ci/images.sh save ~/.cache/supabase-images
      - name: Run the shard on a production build, retrying a failed test once
        run: tools/ci/jobs/e2e.sh $PROJECTS --shard="$SHARD" --reporter=list,blob
        env:
          PROJECTS: ${{ matrix.projects }}
          SHARD: ${{ matrix.shard }}
          # Playwright's weights for the shards, by test count: the first clock specs cost about twice what the last ones do.
          PWTEST_SHARD_WEIGHTS: ${{ matrix.weights }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: ${{ matrix.id }}.zip
      - id: strip
        if: ${{ !cancelled() }}
        run: tools/ci/strip-key-traces.sh blob-report
      - if: ${{ !cancelled() && steps.strip.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-${{ matrix.id }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

  e2e-report:
    needs: e2e
    if: ${{ !cancelled() && github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*
          merge-multiple: true
          path: all-blob-reports
      - name: Merge the shards, count the tests and name the flaky ones
        run: tools/ci/e2e-report.sh all-blob-reports
      - if: ${{ needs.e2e.result == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  prod-build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: 'true'
      - run: tools/ci/jobs/prod-build.sh

  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: tools/ci/jobs/design.sh

  mutation:
    if: ${{ github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: tools/ci/jobs/mutation.sh

  ci:
    needs: [check, db, e2e, e2e-report, prod-build, design, mutation]
    # Skipped on a draft, so it sends no failure event and no merge can read it as green.
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do case " $ALLOWED " in *" $result "*) ;; *) exit 1 ;; esac; done
        env:
          # A push to main skips the e2e jobs and mutation by design; no other run may pass with a skipped job.
          ALLOWED: ${{ github.event_name == 'push' && 'success skipped' || 'success' }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
