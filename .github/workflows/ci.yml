name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # pnpm quality compares the baseline with the copy where this branch forked from origin/main.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          # apps/web unit tests draw images in headless Chromium.
          browsers: 'true'
      - run: pnpm check
      - run: pnpm test:live

  db:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.90.0
      - run: tools/ci/db-start.sh -x studio,realtime,imgproxy,mailpit,postgres-meta
      - name: Reset twice and compare checksums
        # The Supabase CLI can answer 502 while db reset restarts the Storage container; one restart of the stack and
        # one retry clear it, as tools/ci-local.sh does.
        run: |
          pnpm db:seed:check 2>&1 | tee "$RUNNER_TEMP/seed-check.log" && exit 0
          grep -q 'Error status 502' "$RUNNER_TEMP/seed-check.log" || exit 1
          echo "::warning::db reset got a 502 while it restarted a container; restarting the stack and retrying once"
          pnpm db:stop
          tools/ci/db-start.sh -x studio,realtime,imgproxy,mailpit,postgres-meta
          pnpm db:seed:check
      - run: pnpm db:test
      - name: Generated database types match the migrations
        run: pnpm db:types && git diff --exit-code packages/db/src/database.types.ts

  e2e:
    name: e2e (${{ matrix.id }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The clock project runs one test at a time because a stack has one test clock, and Playwright shards by test
      # count in project order, so plain --shard would pile the clock specs onto the last shards. Each shard has its
      # own stack, so the clock specs split across four. tools/ci/e2e-summary.mjs fails when a project runs nowhere.
      matrix:
        include:
          - { id: viewports-1, projects: --project=mobile --project=desktop, shard: 1/2 }
          - { id: viewports-2, projects: --project=mobile --project=desktop, shard: 2/2 }
          - { id: clock-1, projects: --project=clock, shard: 1/4 }
          - { id: clock-2, projects: --project=clock, shard: 2/4 }
          - { id: clock-3, projects: --project=clock, shard: 3/4 }
          - { id: clock-4, projects: --project=clock, shard: 4/4 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: 'true'
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.90.0
      - run: tools/ci/db-start.sh -x studio,realtime,imgproxy,postgres-meta
      - name: Run the shard on a production build, retrying a failed test once
        run: pnpm e2e $PROJECTS --shard="$SHARD" --retries=1 --reporter=list,blob
        env:
          PROJECTS: ${{ matrix.projects }}
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: ${{ matrix.id }}.zip
      - name: DIAG
        if: ${{ !cancelled() && matrix.id == 'clock-1' }}
        continue-on-error: true
        run: |
          set +e
          (for i in $(seq 1 90); do echo "--- t=$i"; ss -ltnp | grep -E ':3000\b'; lsof -nP -iTCP:3000 -sTCP:LISTEN; echo "lsof=$?"; sleep 2; done >"$RUNNER_TEMP/watch.log" 2>&1 &)
          pnpm e2e --project=clock e2e/fnd9-integration.spec.ts --reporter=line >"$RUNNER_TEMP/spec.log" 2>&1
          tail -5 "$RUNNER_TEMP/spec.log" | cut -c1-200
          grep -m3 -B2 -A6 'lsof=0' "$RUNNER_TEMP/watch.log" | head -30
          grep -c 'lsof=1' "$RUNNER_TEMP/watch.log"
      - id: strip
        if: ${{ !cancelled() }}
        run: tools/ci/strip-key-traces.sh blob-report
      - if: ${{ !cancelled() && steps.strip.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-${{ matrix.id }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

  e2e-report:
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*
          merge-multiple: true
          path: all-blob-reports
      - run: pnpm exec playwright merge-reports --reporter=html,json all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
      - name: Count the tests and name the flaky ones
        run: node tools/ci/e2e-summary.mjs e2e-results.json
      - if: ${{ needs.e2e.result == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  prod-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: 'true'
      - run: pnpm e2e:prod
      - run: pnpm check:build-env

  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the Impeccable engine at the digest in .github/impeccable-engine.sha256
        run: |
          bin=$(scripts/install-impeccable-engine.sh "$RUNNER_TEMP/impeccable")
          echo "IMPECCABLE_BIN=$bin" >> "$GITHUB_ENV"
      - run: test "$(.claude/skills/impeccable/scripts/impeccable engine-probe)" = "impeccable-engine $(cat .claude/skills/impeccable/scripts/VERSION)"
      - run: pnpm design:detect

  ci:
    needs: [check, db, e2e, e2e-report, prod-build, design]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
