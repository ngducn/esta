version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '@types/node'
        versions: ['>=25']
      # 0.63 re-renders the fixture images, which breaks the byte-pinned manifests and replay recordings
      - dependency-name: satori
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
      npm-weekly:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
