name: Set up the workspace
description: pnpm from packageManager, Node from .nvmrc with the pnpm store cached, the workspace dependencies, and optionally Chromium for Playwright with its download cached.

inputs:
  browsers:
    description: Install Chromium for Playwright
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - id: playwright
      if: inputs.browsers == 'true'
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      shell: bash
    - id: browsers
      if: inputs.browsers == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - if: inputs.browsers == 'true' && steps.browsers.outputs.cache-hit != 'true'
      run: pnpm exec playwright install --with-deps --only-shell chromium
      shell: bash
