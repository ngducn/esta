<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Cover</title>
<style>
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); }
  .cv svg { display: block; }
  .cv-art { position: absolute; inset: 0; }
  .cv-accent { fill: var(--accent); }
  .cv-on { fill: var(--on-accent); }
  .cv-tint { fill: var(--accent-subtle); }
  .cv-ink { fill: var(--surface-inverse); }
  .cv-ink-text { fill: var(--text-inverse); }
  .cv-seal { fill: var(--accent); }
  .cv-r { rx: var(--radius-xl); }
  .cv-text { position: absolute; left: var(--space-12); bottom: var(--space-12); max-width: 440px; }
  .cv-word { fill: var(--text); }
  .cv-tag { margin: var(--space-4) 0 0; font-size: 0.875rem; line-height: 1.25rem; color: var(--text-muted); }
</style>
</head>

    pattern: the brand layer's fine line pattern, 8px pitch (space-2): twenty vertical hairlines fading across the blue slab, ten ledger rows fading up the ink block.
    type: the outlined ESTA wordmark (Inter Display Medium, +22%) with its blue seal, the same paths as esta-logo.svg; tagline 14px muted.
